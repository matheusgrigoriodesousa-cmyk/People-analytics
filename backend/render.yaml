services:
  - type: web
    name: people-analytics-api
    env: python
    region: ohio
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DATABASE_URL
        fromDatabase:
          name: people-analytics-db
          property: connectionString

databases:
  - name: people-analytics-db
    region: ohio
    plan: free
    databaseName: people_analytics
    user: admin